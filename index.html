<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎯 数学小达人 - 蜡笔小新版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    
    /* 蜡笔小新背景 - 添加备用背景 */
    .shinchan-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      z-index: -1;
    }
    
    /* 开始页面 */
    .start-screen {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 25px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      width: 90%;
      text-align: center;
      border: 8px solid #ff6b8b;
      position: relative;
      overflow: hidden;
    }
    
    .start-title {
      color: #ff4081;
      font-size: 2.5rem;
      margin-bottom: 20px;
      text-shadow: 3px 3px 0 #ffd166;
      letter-spacing: 1px;
    }
    
    .start-subtitle {
      color: #5a5a5a;
      font-size: 1.2rem;
      margin-bottom: 30px;
      font-weight: bold;
    }
    
    .start-shinchan {
      width: 150px;
      height: 150px;
      margin: 0 auto 30px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 2rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      animation: bounce 2s infinite alternate;
      overflow: hidden;
      background: #ff6b8b;
    }
    
    .start-shinchan img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    .start-btn {
      font-size: 1.5rem;
      padding: 15px 40px;
      background-color: #ff6b8b;
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      font-weight: bold;
      box-shadow: 0 5px 0 rgba(0,0,0,0.2);
      margin-top: 20px;
    }
    
    .start-btn:hover {
      background-color: #ff4081;
      transform: translateY(-3px);
      box-shadow: 0 8px 0 rgba(0,0,0,0.2);
    }
    
    /* 选择页面 */
    .selection-screen {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 25px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      width: 90%;
      text-align: center;
      border: 8px solid #ff6b8b;
      position: relative;
      overflow: hidden;
      display: none;
    }
    
    .selection-title {
      color: #ff4081;
      font-size: 2.2rem;
      margin-bottom: 20px;
      text-shadow: 3px 3px 0 #ffd166;
    }
    
    .mode-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin: 30px 0;
    }
    
    .mode-btn {
      font-size: 1.3rem;
      padding: 15px 30px;
      background-color: #4ecdc4;
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      font-weight: bold;
      box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    }
    
    .mode-btn:hover {
      background-color: #3db8af;
      transform: translateY(-3px);
      box-shadow: 0 8px 0 rgba(0,0,0,0.2);
    }
    
    /* 游戏页面 */
    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      max-width: 700px;
      width: 95%;
      text-align: center;
      border: 8px solid #ff6b8b;
      position: relative;
      overflow: hidden;
      display: none;
    }
    
    .header {
      margin-bottom: 20px;
      position: relative;
    }
    
    h1 {
      color: #ff4081;
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 3px 3px 0 #ffd166;
      letter-spacing: 1px;
    }
    
    .subtitle {
      color: #5a5a5a;
      font-size: 1.2rem;
      margin-bottom: 10px;
      font-weight: bold;
    }
    
    .shinchan-character {
      width: 120px;
      height: 120px;
      margin: 0 auto 15px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.5rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      animation: bounce 2s infinite alternate;
      overflow: hidden;
      background: #ff6b8b;
    }
    
    .shinchan-character img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-15px); }
    }
    
    .stats-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    
    .stat-box {
      background: #fff;
      padding: 12px 15px;
      border-radius: 15px;
      flex: 1;
      margin: 5px;
      min-width: 120px;
      border: 3px solid #4ecdc4;
      box-shadow: 0 5px 0 rgba(0,0,0,0.1);
    }
    
    .stat-label {
      font-size: 0.9rem;
      color: #5a5a5a;
      font-weight: bold;
    }
    
    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #ff6b8b;
    }
    
    #total-correct {
      background: #fff9c4;
      border-color: #ffd166;
    }
    
    #timer {
      background: #e3f2fd;
      border-color: #4ecdc4;
    }
    
    #best-total {
      background: #ffebee;
      border-color: #ff6b8b;
    }
    
    .difficulty-selector {
      margin: 20px 0;
    }
    
    .difficulty-btn {
      background: #e0e0e0;
      border: none;
      padding: 10px 15px;
      margin: 0 5px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
      font-family: inherit;
    }
    
    .difficulty-btn.active {
      background: #ff6b8b;
      color: white;
      transform: scale(1.05);
    }
    
    #problem {
      font-size: 2.5rem;
      margin: 25px 0;
      font-weight: bold;
      color: #2a2d43;
      transition: all 0.3s;
      background: #f7f9fc;
      padding: 20px;
      border-radius: 15px;
      border: 3px dashed #4ecdc4;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }
    
    /* 答题框样式 */
    .input-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 25px 0;
      width: 100%;
    }
    
    input {
      font-size: 2.2rem;
      padding: 20px;
      width: 280px;
      text-align: center;
      border: 4px solid #ff6b8b;
      border-radius: 20px;
      outline: none;
      transition: all 0.3s;
      font-family: inherit;
      font-weight: bold;
      background: #fff;
      display: block;
      margin: 0 auto;
    }
    
    input:focus {
      border-color: #4ecdc4;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(78, 205, 196, 0.5);
    }
    
    .buttons {
      margin: 25px 0;
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    
    button {
      font-size: 1.3rem;
      padding: 15px 30px;
      background-color: #ff6b8b;
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      opacity: 1;
      transition: all 0.3s;
      font-family: inherit;
      font-weight: bold;
      box-shadow: 0 5px 0 rgba(0,0,0,0.2);
      min-width: 150px;
    }
    
    button:hover {
      background-color: #ff4081;
      transform: translateY(-3px);
      box-shadow: 0 8px 0 rgba(0,0,0,0.2);
    }
    
    button:active {
      transform: translateY(0);
      box-shadow: 0 3px 0 rgba(0,0,0,0.2);
    }
    
    #submitBtn.wrong {
      background-color: #ff5252;
    }
    
    #result {
      font-size: 1.8rem;
      margin: 20px 0;
      height: 50px;
      font-weight: bold;
      min-height: 50px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    
    .correct {
      color: #4ecdc4;
      animation: pulse 0.5s;
    }
    
    .wrong {
      color: #ff5252;
      animation: shake 0.5s;
    }
    
    .hidden {
      display: none !important;
    }
    
    /* 分数显示样式 */
    .fraction {
      display: inline-block;
      text-align: center;
      vertical-align: middle;
    }
    
    .fraction span {
      display: block;
    }
    
    .fraction .numerator {
      border-bottom: 2px solid #2a2d43;
      padding: 0 5px;
    }
    
    .fraction .denominator {
      padding: 0 5px;
    }
    
    /* 蜡笔小新鼓励弹窗 */
    .encouragement-popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.5s;
    }
    
    .encouragement-popup.show {
      opacity: 1;
      visibility: visible;
    }
    
    .encouragement-content {
      background: white;
      border-radius: 25px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      border: 8px solid #ff6b8b;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      transform: scale(0.7);
      transition: transform 0.5s;
    }
    
    .encouragement-popup.show .encouragement-content {
      transform: scale(1);
    }
    
    .encouragement-shinchan {
      width: 150px;
      height: 150px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 2rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      animation: bounce 1s infinite alternate;
      overflow: hidden;
      background: #ff6b8b;
    }
    
    .encouragement-shinchan img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    .encouragement-message {
      font-size: 1.8rem;
      color: #ff4081;
      margin-bottom: 20px;
      font-weight: bold;
      line-height: 1.4;
    }
    
    .encouragement-subtitle {
      font-size: 1.2rem;
      color: #5a5a5a;
      margin-bottom: 25px;
    }
    
    .close-encouragement {
      background: #4ecdc4;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 15px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }
    
    .close-encouragement:hover {
      background: #3db8af;
      transform: translateY(-3px);
    }
    
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #f00;
      opacity: 0;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }
    
    .footer {
      margin-top: 20px;
      color: #7f8c8d;
      font-size: 0.9rem;
    }
    
    @media (max-width: 480px) {
      .container, .start-screen, .selection-screen {
        padding: 20px;
      }
      
      h1, .start-title, .selection-title {
        font-size: 2rem;
      }
      
      #problem {
        font-size: 1.8rem;
      }
      
      input {
        font-size: 1.8rem;
        width: 220px;
        padding: 15px;
      }
      
      button {
        font-size: 1.1rem;
        padding: 12px 20px;
        min-width: 120px;
      }
      
      .stat-box {
        min-width: 100px;
      }
      
      .shinchan-character, .start-shinchan {
        width: 100px;
        height: 100px;
      }
      
      .buttons {
        flex-direction: column;
        align-items: center;
      }
      
      .encouragement-content {
        padding: 20px;
      }
      
      .encouragement-message {
        font-size: 1.5rem;
      }
      
      .encouragement-shinchan {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>
<body>
  <!-- 蜡笔小新背景 -->
  <div class="shinchan-bg"></div>

  <!-- 开始页面 -->
  <div class="start-screen" id="startScreen">
    <h1 class="start-title">🎯 数学小达人</h1>
    <p class="start-subtitle">和蜡笔小新一起学数学！</p>
    <div class="start-shinchan">
      <!-- 图片加载失败时显示文字 -->
      <span style="display:none;">小新</span>
    </div>
    <button class="start-btn" id="startBtn">开始挑战</button>
  </div>

  <!-- 选择页面 -->
  <div class="selection-screen" id="selectionScreen">
    <h1 class="selection-title">选择挑战模式</h1>
    <div class="mode-buttons">
      <button class="mode-btn" data-mode="add-sub">加减混合</button>
      <button class="mode-btn" data-mode="mul-div">乘除混合</button>
      <button class="mode-btn" data-mode="all">加减乘除混合</button>
    </div>
  </div>

  <!-- 蜡笔小新鼓励弹窗 -->
  <div class="encouragement-popup" id="encouragementPopup">
    <div class="encouragement-content">
      <div class="encouragement-shinchan">
        <span style="display:none;">小新</span>
      </div>
      <div class="encouragement-message">你好棒啊，都连续答对十道了！</div>
      <div class="encouragement-subtitle">继续加油，动感超人！</div>
      <button class="close-encouragement" id="closeEncouragement">继续挑战</button>
    </div>
  </div>

  <!-- 游戏页面 -->
  <div class="container" id="gameContainer">
    <div class="header">
      <h1>🎯 数学小达人</h1>
      <p class="subtitle">和蜡笔小新一起学数学！</p>
      <div class="shinchan-character">
        <span style="display:none;">小新</span>
      </div>
    </div>
    
    <div class="stats-container">
      <div id="total-correct" class="stat-box">
        <div class="stat-label">累计答对</div>
        <div class="stat-value">0</div>
      </div>
      <div id="timer" class="stat-box">
        <div class="stat-label">用时</div>
        <div class="stat-value">0秒</div>
      </div>
      <div id="best-total" class="stat-box">
        <div class="stat-label">最高答对</div>
        <div class="stat-value">0</div>
      </div>
    </div>
    
    <div class="difficulty-selector">
      <button class="difficulty-btn active" data-level="easy">简单</button>
      <button class="difficulty-btn" data-level="medium">中等</button>
      <button class="difficulty-btn" data-level="hard">困难</button>
    </div>
    
    <div id="problem">6 × 7 = ?</div>
    
    <div class="input-container">
      <input type="text" id="answer" autofocus placeholder="输入答案 (如: 2/3)" />
    </div>
    
    <div class="buttons">
      <button id="submitBtn">提交答案</button>
      <button id="nextBtn" class="hidden">下一题</button>
    </div>
    
    <div id="result"></div>
    
    <div class="footer">
      <p>答对越多，蜡笔小新越开心哦！</p>
    </div>
  </div>

  <script>
    // 游戏状态
    let correctAnswer;
    let correctAnswerFraction;
    let streak = 0;
    let totalCorrect = 0;
    let bestTotal = 0;
    let startTime;
    let timerInterval;
    let difficulty = 'easy';
    let gameMode = 'mul-div';

    // DOM 元素
    const startScreen = document.getElementById("startScreen");
    const selectionScreen = document.getElementById("selectionScreen");
    const gameContainer = document.getElementById("gameContainer");
    const startBtn = document.getElementById("startBtn");
    const modeBtns = document.querySelectorAll(".mode-btn");
    
    const problemElement = document.getElementById("problem");
    const answerInput = document.getElementById("answer");
    const resultElement = document.getElementById("result");
    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");
    const totalCorrectElement = document.getElementById("total-correct").querySelector(".stat-value");
    const timerElement = document.getElementById("timer").querySelector(".stat-value");
    const bestTotalElement = document.getElementById("best-total").querySelector(".stat-value");
    const difficultyBtns = document.querySelectorAll(".difficulty-btn");
    const encouragementPopup = document.getElementById("encouragementPopup");
    const closeEncouragementBtn = document.getElementById("closeEncouragement");

    // 图片路径配置
    const imagePaths = {
      background: 'image/蜡笔小新.jpg',
      startAvatar: 'image/OIP-C.webp',
      gameAvatar: 'image/nizihua.jpg'
    };

    // 初始化游戏
    function initGame() {
      // 加载图片
      loadImages();
      
      // 开始按钮事件
      startBtn.addEventListener('click', () => {
        startScreen.style.display = 'none';
        selectionScreen.style.display = 'block';
      });
      
      // 模式选择事件
      modeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          gameMode = btn.dataset.mode;
          selectionScreen.style.display = 'none';
          gameContainer.style.display = 'block';
          startGame();
        });
      });
      
      // 难度选择事件
      difficultyBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          difficultyBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          difficulty = btn.dataset.level;
          next();
        });
      });
      
      // 添加键盘事件
      answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          check();
        }
      });
      
      submitBtn.addEventListener('click', check);
      nextBtn.addEventListener('click', next);
      
      // 关闭鼓励弹窗事件
      closeEncouragementBtn.addEventListener('click', () => {
        encouragementPopup.classList.remove('show');
      });
    }

    // 加载图片
    function loadImages() {
      // 加载背景图片
      const bg = new Image();
      bg.onload = function() {
        document.querySelector('.shinchan-bg').style.backgroundImage = `url('${imagePaths.background}')`;
      };
      bg.onerror = function() {
        console.log('背景图片加载失败，使用渐变背景');
      };
      bg.src = imagePaths.background;

      // 加载开始页面头像
      const startAvatar = new Image();
      startAvatar.onload = function() {
        const startShinchan = document.querySelector('.start-shinchan');
        startShinchan.innerHTML = `<img src="${imagePaths.startAvatar}" alt="蜡笔小新" onerror="this.style.display='none'; this.parentNode.querySelector('span').style.display='block';">`;
      };
      startAvatar.onerror = function() {
        const startShinchan = document.querySelector('.start-shinchan');
        startShinchan.querySelector('span').style.display = 'block';
      };
      startAvatar.src = imagePaths.startAvatar;

      // 加载游戏页面和弹窗头像
      const gameAvatar = new Image();
      gameAvatar.onload = function() {
        const gameShinchans = document.querySelectorAll('.shinchan-character, .encouragement-shinchan');
        gameShinchans.forEach(el => {
          el.innerHTML = `<img src="${imagePaths.gameAvatar}" alt="蜡笔小新" onerror="this.style.display='none'; this.parentNode.querySelector('span').style.display='block';">`;
        });
      };
      gameAvatar.onerror = function() {
        const gameShinchans = document.querySelectorAll('.shinchan-character, .encouragement-shinchan');
        gameShinchans.forEach(el => {
          el.querySelector('span').style.display = 'block';
        });
      };
      gameAvatar.src = imagePaths.gameAvatar;
    }

    // 开始游戏
    function startGame() {
      totalCorrect = 0;
      streak = 0;
      updateStats();
      startTimer();
      next();
    }

    // 生成下一题
    function next() {
      let problem = '';
      let expression = '';
      
      // 根据游戏模式和难度生成题目
      switch(gameMode) {
        case 'add-sub':
          problem = generateAddSubProblem();
          break;
          
        case 'mul-div':
          problem = generateMulDivProblem();
          break;
          
        case 'all':
          problem = generateAllProblem();
          break;
      }
      
      // 计算正确答案
      try {
        correctAnswer = eval(problem.expression);
        // 确保答案有效
        if (isNaN(correctAnswer) || !isFinite(correctAnswer)) {
          return next(); // 重新生成题目
        }
        
        // 计算分数形式
        correctAnswerFraction = decimalToFraction(correctAnswer);
      } catch (e) {
        return next(); // 重新生成题目
      }
      
      // 显示题目
      problemElement.textContent = problem.display;
      answerInput.value = "";
      resultElement.textContent = "";
      resultElement.className = "";
      submitBtn.classList.remove("wrong");
      submitBtn.disabled = false;
      submitBtn.style.opacity = "1";
      nextBtn.classList.add("hidden");
      answerInput.focus();
    }

    // 小数转分数
    function decimalToFraction(decimal) {
      // 如果是整数，直接返回
      if (Number.isInteger(decimal)) {
        return { numerator: decimal, denominator: 1, display: decimal.toString() };
      }
      
      // 处理小数
      const tolerance = 1.0E-6;
      let numerator = 1;
      let denominator = 1;
      let fraction = numerator / denominator;
      
      // 尝试找到最接近的分数
      while (Math.abs(fraction - decimal) > tolerance) {
        if (fraction < decimal) {
          numerator++;
        } else {
          denominator++;
          numerator = Math.round(decimal * denominator);
        }
        fraction = numerator / denominator;
        
        // 防止无限循环
        if (denominator > 10000) {
          break;
        }
      }
      
      // 约分
      const gcdValue = gcd(numerator, denominator);
      numerator /= gcdValue;
      denominator /= gcdValue;
      
      // 生成显示格式
      let display;
      if (denominator === 1) {
        display = numerator.toString();
      } else {
        display = `<div class="fraction">
          <span class="numerator">${numerator}</span>
          <span class="denominator">${denominator}</span>
        </div>`;
      }
      
      return { numerator, denominator, display };
    }

    // 计算最大公约数
    function gcd(a, b) {
      return b ? gcd(b, a % b) : a;
    }

    // 解析用户输入的分数
    function parseFractionInput(input) {
      // 如果是整数
      if (/^-?\d+$/.test(input)) {
        return parseInt(input);
      }
      
      // 如果是分数格式 a/b
      const fractionMatch = input.match(/^(-?\d+)\/(-?\d+)$/);
      if (fractionMatch) {
        const numerator = parseInt(fractionMatch[1]);
        const denominator = parseInt(fractionMatch[2]);
        if (denominator === 0) return NaN;
        return numerator / denominator;
      }
      
      // 如果是小数
      const decimalMatch = input.match(/^-?\d*\.?\d+$/);
      if (decimalMatch) {
        return parseFloat(input);
      }
      
      return NaN;
    }
