<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎯 乘法小达人</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 40px;
      margin: 0;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      min-height: 100vh;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 30px 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 90%;
    }

    h1 {
      color: #2c3e50;
      margin: 0 0 10px 0;
      font-size: 1.8em;
    }

    .subtitle {
      color: #7f8c8d;
      font-size: 1.1em;
      margin-bottom: 20px;
    }

    #streak {
      font-size: 1.3em;
      color: #f39c12;
      margin: 15px 0;
      font-weight: bold;
      background: #fff3cd;
      padding: 8px 15px;
      border-radius: 12px;
      display: inline-block;
    }

    #problem {
      font-size: 3em;
      margin: 20px 0;
      font-weight: bold;
      color: #2980b9;
    }

    input {
      font-size: 1.6em;
      padding: 15px;
      width: 180px;
      text-align: center;
      border: 3px solid #3498db;
      border-radius: 12px;
      outline: none;
      transition: all 0.3s;
      margin: 10px 0;
    }

    input:focus {
      border-color: #e74c3c;
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(231, 76, 60, 0.3);
    }

    .buttons {
      margin: 20px 0;
    }

    button {
      font-size: 1.2em;
      padding: 12px 25px;
      margin: 0 10px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      opacity: 1;
      transition: all 0.3s;
    }

    button:hover {
      background-color: #2980b9;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    #submitBtn.wrong {
      background-color: #e74c3c;
    }

    #result {
      font-size: 1.8em;
      margin: 20px 0;
      height: 40px;
      font-weight: bold;
      min-height: 40px;
    }

    .correct {
      color: #27ae60;
    }

    .wrong {
      color: #e74c3c;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎯 乘法小达人</h1>
    <p class="subtitle">来挑战连续答对吧！</p>
    
    <div id="streak">✅ 已连续答对：0 题</div>
    
    <div id="problem">6 × 7 = ?</div>
    
    <input type="number" id="answer" autofocus placeholder="输入答案" />
    
    <div class="buttons">
      <button id="submitBtn" onclick="check()">提交</button>
      <button id="nextBtn" class="hidden" onclick="next()">下一题</button>
    </div>
    
    <div id="result"></div>
  </div>

  <script>
    let correctAnswer;
    let streak = 0;

    function next() {
      const a = Math.floor(Math.random() * 10);
      const b = Math.floor(Math.random() * 10);
      correctAnswer = a * b;
      document.getElementById("problem").textContent = `${a} × ${b} = ?`;
      document.getElementById("answer").value = "";
      document.getElementById("result").textContent = "";
      document.getElementById("result").className = "";
      document.getElementById("submitBtn").classList.remove("wrong");
      document.getElementById("submitBtn").disabled = false;
      document.getElementById("submitBtn").style.opacity = "1";
      document.getElementById("nextBtn").classList.add("hidden");
      document.getElementById("answer").focus();
    }

    function check() {
      const user = parseInt(document.getElementById("answer").value);
      const resultDiv = document.getElementById("result");
      const submitBtn = document.getElementById("submitBtn");

      if (isNaN(user)) {
        resultDiv.textContent = "请输入一个数字！";
        resultDiv.className = "wrong";
        return;
      }

      if (user === correctAnswer) {
        streak++;
        resultDiv.textContent = "🎉 正确！";
        resultDiv.className = "correct";
        document.getElementById("streak").textContent = `✅ 已连续答对：${streak} 题`;
        
        // 自动下一题（2秒后）
        submitBtn.disabled = true;
        submitBtn.style.opacity = "0.6";
        setTimeout(next, 1000); // 1秒后自动下一题
      } else {
        resultDiv.textContent = `❌ 错了！正确答案是 ${correctAnswer}`;
        resultDiv.className = "wrong";
        streak = 0;
        document.getElementById("streak").textContent = `✅ 已连续答对：0 题`;
        submitBtn.classList.add("wrong");
        
        // 显示“下一题”按钮
        document.getElementById("nextBtn").classList.remove("hidden");
      }
    }

    // 初始化第一题
    next();
  </script>

</body>
</html>
